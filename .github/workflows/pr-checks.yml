name: Pull Request Automated Checks

# Thin caller for the shared org workflow. Everything lives in
# Nano-Collective/.github — change it there and every repo picks it up.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  pr-checks:
    uses: Nano-Collective/.github/.github/workflows/pr-checks.yml@main
    with:
      # TEMPORARY. The org standard is 80. nanoterm is at 61.5%, the largest
      # gap in the org, so the floor is pinned just under current coverage and
      # fail-on-drop (on by default) ratchets it — coverage cannot regress
      # while the gap closes. Delete this input once coverage clears 80.
      # Tracked in #23. nanoterm stays out of the org quality ruleset until then.
      coverage-threshold: 61
